name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The release train bumps the version and writes CHANGELOG once a day;
      # a pull request adds changes/<branch>.md instead (docs/releases.md).
      - name: The version and CHANGELOG are the release train's
        if: github.event_name == 'pull_request'
        run: node scripts/release-train.mjs check-pr "${{ github.event.pull_request.base.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run deadcode
      - run: npm test
      - run: npm run smoke
      - name: command docs drift check
        run: node scripts/generate-command-docs.mjs --check
